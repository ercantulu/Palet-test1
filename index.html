<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palet Sayım">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Palet Sayım</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232731;--line:#2e3340;--tx:#f2f4f8;--mut:#9aa3b2;--ok:#22c55e;--okd:#15803d;--warn:#f59e0b;--err:#ef4444;--acc:#38bdf8;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus{border-color:var(--acc)}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.pallet{display:flex;flex-direction:column;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 14px;min-width:0;flex:1}
.pallet .lbl{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:600}
.pallet .pno{font-size:26px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pallet .pno.none{color:var(--warn);font-size:20px}
.ptot{text-align:right;font-size:13px;color:var(--mut);line-height:1.5}
.ptot b{color:var(--tx);font-size:20px;display:block;line-height:1.1}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px;display:none}
.view.active{display:block}
#v-scan{padding:0}
.cam{position:relative;height:44vh;min-height:250px;background:#000;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.box{position:absolute;left:7%;right:7%;top:30%;height:40%;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);border:3px solid rgba(255,255,255,.85)}
.laser{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--err);box-shadow:0 0 8px var(--err);animation:las 1.6s ease-in-out infinite alternate}
@keyframes las{from{transform:translateY(-28px)}to{transform:translateY(28px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
.flash.ok{background:rgba(34,197,94,.55);opacity:1;transition:none}
.flash.err{background:rgba(239,68,68,.6);opacity:1;transition:none}
.banner{position:absolute;left:10px;right:10px;top:10px;background:var(--warn);color:#111;font-weight:700;text-align:center;border-radius:12px;padding:10px}
.camtools{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.camtools button{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);font-size:20px;border:1px solid rgba(255,255,255,.25);font-weight:700}
.camtools button.on{background:var(--warn);color:#111}
.camstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b0d11;padding:20px;text-align:center}
.camstart p{color:var(--mut);margin:0;font-size:14px;max-width:320px}
.big{background:var(--ok);color:#06240f;font-weight:800;font-size:20px;padding:18px 28px;border-radius:16px}
.scanbody{padding:12px 14px 20px}
.seg2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg2 button{flex:1;padding:12px 6px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg2 button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.row2{display:flex;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:16px}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--ok);color:#06240f}
.btn.warn{background:var(--warn);color:#111}
.btn.danger{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn.dangerfill{background:var(--err);color:#fff}
.row2 .btn,.wide{flex:1;width:100%}
.sect{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:18px 2px 8px}
.recent{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.ritem .nm{flex:1;min-width:0}
.ritem .nm div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .nm div:last-child{font-size:12px;color:var(--mut)}
.ritem .q{font-size:22px;font-weight:800;min-width:48px;text-align:right}
.ritem.unk .nm div:first-child{color:var(--warn)}
.empty{color:var(--mut);text-align:center;padding:16px;font-size:14px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;color:var(--mut);position:relative}
.tabs button span{font-size:11px;font-weight:600}
.tabs button.on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--warn);color:#111;font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + var(--sb));max-height:94vh;overflow-y:auto;border-top:1px solid var(--line);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 12px;font-size:20px}
.pinfo{background:var(--card2);border-radius:14px;padding:10px 14px;border-left:5px solid var(--ok)}
.pinfo.unk{border-left-color:var(--warn)}
.pname{font-weight:800;font-size:18px}
.pinfo.unk .pname{color:var(--warn)}
.vol{color:var(--acc);font-weight:700}
.pmeta{font-size:13px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.note{margin-top:8px;font-size:14px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);border-radius:10px;padding:8px 10px}
.note.w{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}
.qty{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:10px 0 6px}
.qty span{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.qty span.ph{color:#5b6372}
.qty small{color:var(--mut);font-size:16px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 10px}
.chips.left{justify-content:flex-start}
.chips button{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;min-width:54px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--card2);border:1px solid var(--line);border-radius:14px;font-size:28px;font-weight:700;height:54px}
.pad button:active,.chips button:active,.btn:active{filter:brightness(1.3)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{flex:1}
.acts .btn.primary{flex:1.6;font-size:19px}
.fld{display:block;font-size:13px;color:var(--mut);margin:10px 0}
.fld input,.fld select{margin-top:5px}
.bigin{font-size:24px;font-weight:700;text-align:center;letter-spacing:.04em}
.mres{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:40vh;overflow:auto}
.sum{display:flex;gap:8px;margin:6px 0 4px}
.sum div{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:26px}
.sum span{font-size:12px;color:var(--mut)}
/* list */
.lhead{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.grp.act{border-color:var(--acc)}
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2)}
.gh .t{flex:1;min-width:0}
.gh .t b{font-size:18px}
.gh .t div{font-size:12px;color:var(--mut)}
.gh button{font-size:13px;font-weight:700;color:var(--acc);padding:8px 4px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow .nm{flex:1;min-width:0}
.lrow .nm div:first-child{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm div:last-child{font-size:12px;color:var(--mut)}
.lrow .q{font-weight:800;font-size:19px}
.lrow.unk .nm div:first-child{color:var(--warn)}
.stats{display:flex;gap:8px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mut)}
.prev{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto;color:#cbd5e1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tgl span small{display:block;color:var(--mut);font-size:12px}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:16px;background:var(--line);transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.mut{color:var(--mut);font-size:13px}
.toast{position:fixed;left:12px;right:12px;top:calc(var(--st) + 84px);z-index:30;background:#f2f4f8;color:#111;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast span{flex:1}
.toast.ok{background:var(--ok);color:#06240f}
.toast.err{background:var(--err);color:#fff}
.toast.warn{background:var(--warn);color:#111}
.toast button{background:rgba(0,0,0,.18);padding:8px 12px;border-radius:10px;font-weight:800}
.pcbtn{display:inline-block;margin-top:6px;font-size:14px;color:var(--acc);font-weight:700;padding:4px 0}
.pcbtn.miss{color:var(--warn)}
.pcrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.pcrow input{flex:1}
.lotrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.lotrow input{flex:1;font-weight:700;letter-spacing:.03em}
.lotrow button{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.cu{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:stretch;margin:10px 0 2px}
.cu .plus{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;font-weight:700}
.fbox{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;align-items:center}
.fbox.on{border-color:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.fbox small{font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:800}
.fbox span{font-size:40px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.fbox span.ph{color:#5b6372}
.fbox em{font-style:normal;font-size:12px;color:var(--mut);min-height:15px}
.fbox.dis span{color:var(--warn);font-size:15px;padding:12px 0 6px;text-align:center}
.tot{text-align:center;color:var(--mut);margin:2px 0 6px;font-size:14px}
.tot b{color:var(--tx);font-size:24px}
.tag{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--mut);font-weight:600;white-space:nowrap}
.lot{color:var(--acc);font-weight:700}
.pcl{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.pcl div{display:flex;align-items:center;gap:8px}
.pcl div span{flex:1;min-width:0;font-size:13px}
.pcl div span small{display:block;color:var(--mut);font-size:11px}
.pcl input{width:84px;flex:none;text-align:center;padding:8px}
.banner.inv{background:var(--acc);display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:left}
.banner.inv button{background:rgba(0,0,0,.2);border-radius:8px;width:36px;height:32px;font-weight:800}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.row-sp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch}
.fchips button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.fchips button.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
.stb{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;vertical-align:middle}
.st-pending{background:var(--card2);color:var(--mut)}.st-ok,.st-quick{background:rgba(34,197,94,.18);color:var(--ok)}
.st-diff{background:rgba(245,158,11,.2);color:var(--warn)}.st-missing{background:rgba(239,68,68,.2);color:var(--err)}
.st-new{background:rgba(56,189,248,.2);color:var(--acc)}.st-open{background:var(--warn);color:#111}
.ritem.pal{align-items:center}
.iline{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.iline input{margin-top:8px}
.expq{font-size:14px;margin-top:6px}
.okrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.seg3{display:flex;gap:4px}.seg3 button{width:48px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:800}
.seg3 button.on{background:var(--ok);color:#06240f;border-color:var(--ok)}.seg3 button.onr{background:var(--err);color:#fff;border-color:var(--err)}
.cuin{display:flex;align-items:flex-end;gap:6px;margin-top:8px}
.cuin label{flex:1;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.cuin input{text-align:center;font-size:20px;font-weight:800;padding:8px 4px;margin-top:3px}
.cuin span{padding-bottom:12px;color:var(--mut);font-weight:700}
.ltot{font-size:20px;padding-bottom:10px;min-width:44px;text-align:right}
.mini{font-size:12px;font-weight:800;color:var(--acc);padding:4px 6px}
.sug .ritem{margin-top:6px}
.tag.warnt{background:rgba(245,158,11,.2);color:var(--warn);border-color:transparent}
.resl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.resl .nm{flex:1;min-width:0}.resl .nm div:first-child{font-weight:700}.resl .nm div:last-child{font-size:12px;color:var(--mut)}
.rq{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}.rq b{font-size:20px}
.pos{color:var(--acc);font-weight:800}.neg{color:var(--err);font-weight:800}
.tabs button span{font-size:10px}
.invctx #modeSeg,.invctx #finishBtn,.invctx .scanbody .sect,.invctx #recent{display:none}
.flash.warn{background:rgba(245,158,11,.55);opacity:1;transition:none}
.hit{position:absolute;border:4px solid transparent;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:2}
.hit.ok{border-color:var(--ok);opacity:1;transition:none;box-shadow:0 0 18px var(--ok)}
.hit.warn{border-color:var(--warn);opacity:1;transition:none;box-shadow:0 0 18px var(--warn)}
.hit.err{border-color:var(--err);opacity:1;transition:none;box-shadow:0 0 18px var(--err)}
.sheet.half{max-height:56vh}
.sheetbg.clear{background:transparent;pointer-events:none}
.sheet.half .grip{margin-bottom:6px}
.exl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.exl .nm{flex:1;min-width:0}.exl .nm div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exl .nm div:last-child{font-size:12px;color:var(--mut)}
.exl .mk{font-size:18px;width:26px;text-align:center}
.exl.done .mk{color:var(--ok)}.exl.abs{opacity:.55}.exl.abs .nm div:first-child{text-decoration:line-through}
.fl{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:8px}
.fl.extra{border-color:var(--warn)}.fl.hl{box-shadow:0 0 0 3px var(--ok)}
.fl .top{display:flex;align-items:center;gap:8px}.fl .top .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .lotin{display:flex;gap:6px;align-items:center;margin-top:6px}.fl .lotin input{flex:1;padding:8px 10px;font-weight:700;margin:0}
.lchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.lchip.on{border-color:var(--ok);color:var(--ok)}
.rbanner{background:var(--acc);color:#04202e;font-weight:800;border-radius:10px;padding:8px 10px;margin:6px 0}
.rcs{margin-top:4px;padding:6px 8px;font-size:13px}
.hd{display:flex;align-items:center;gap:8px}.hd h3{flex:1;margin:0}
.fold{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:10px 0 2px;display:flex;justify-content:space-between}
.exl.warnrow{background:rgba(245,158,11,.15)}
.st-recount{background:var(--acc);color:#04202e}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="palletBtn" class="pallet" data-it="palletLbl">
      <span class="lbl" data-i="palletLbl"></span><span id="palletNo" class="pno none"></span>
    </button>
    <div class="ptot"><b id="pItems">0</b><span data-i="items"></span></div>
    <div class="ptot"><b id="pQty">0</b><span data-i="pcs"></span></div>
  </header>
  <main>
    <section id="v-scan" class="view active">
      <div class="cam" id="cam">
        <video id="video" playsinline muted autoplay></video>
        <div class="box" id="box"><div class="laser"></div></div>
        <div id="flash" class="flash"></div>
        <div id="hit" class="hit"></div>
        <div id="banner" class="banner hidden"></div>
        <div class="camtools">
          <button id="zoomBtn" class="hidden">2×</button>
          <button id="torchBtn" class="hidden">🔦</button>
          <button id="stopBtn" data-it="camClose">✕</button>
        </div>
        <div id="camStart" class="camstart">
          <button id="startBtn" class="big" data-i="startScan"></button>
          <p id="camMsg" data-i="camHint"></p>
        </div>
      </div>
      <div class="scanbody">
        <div class="seg2" id="modeSeg">
          <button data-mode="ask" data-i="modeAsk"></button>
          <button data-mode="plusc" data-i="modePlusC"></button>
          <button data-mode="plusu" data-i="modePlusU"></button>
        </div>
        <div class="row2">
          <button id="manualBtn" class="btn ghost" data-i="manualBtn"></button>
          <button id="finishBtn" class="btn ghost" data-i="finishBtn"></button>
        </div>
        <div class="sect" data-i="recentHdr"></div>
        <div id="recent" class="recent"></div>
      </div>

  const map=pts=>(pts||[]).map(p=>({x:c.x+p.x/k,y:c.y+p.y/k}));
  if(nativeDet){const r=await nativeDet.detect(cv);return r&&r.length?{text:r[0].rawValue,format:String(r[0].format||'').toUpperCase(),pts:map(r[0].cornerPoints)}:null}
  if(mfr){
    try{
      let lum;
      if(ZXing.HTMLCanvasElementLuminanceSource)lum=new ZXing.HTMLCanvasElementLuminanceSource(cv);
      else{const d=cx.getImageData(0,0,cv.width,cv.height).data,g=new Uint8ClampedArray(cv.width*cv.height);
        for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]*306+d[i+1]*601+d[i+2]*117)>>10;
        lum=new ZXing.RGBLuminanceSource(g,cv.width,cv.height)}
      const r=mfr.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum)));
      let pts=[];try{pts=(r.getResultPoints()||[]).filter(Boolean).map(p=>({x:p.getX(),y:p.getY()}))}catch(e){}
      return {text:r.getText(),format:ZXing.BarcodeFormat[r.getBarcodeFormat()],pts:map(pts)};
    }catch(e){return null}
  }
  return null;
}
let lastPts=null;
function showHit(kind){
  const h=$('#hit');if(!h||!lastPts||!lastPts.length||!video.videoWidth)return;
  const r=$('#cam').getBoundingClientRect(),vw=video.videoWidth,vh=video.videoHeight;
  const sc=Math.max(r.width/vw,r.height/vh),offX=(vw*sc-r.width)/2,offY=(vh*sc-r.height)/2;
  const xs=lastPts.map(p=>p.x*sc-offX),ys=lastPts.map(p=>p.y*sc-offY);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const padX=Math.max(14,(x1-x0)*.08),padY=Math.max(26,(y1-y0)*.3);
  h.style.left=(x0-padX)+'px';h.style.top=(y0-padY)+'px';h.style.width=(x1-x0+2*padX)+'px';h.style.height=(y1-y0+2*padY)+'px';
  h.className='hit '+kind;clearTimeout(h._t);h._t=setTimeout(()=>{h.className='hit'},700);lastPts=null;
}
function scanOk(){flash('ok');showHit('ok');beepOk();vib(40)}
function scanWarn(msg){flash('warn');showHit('warn');beepWarn();vib([40,30,40]);if(msg)toast(msg,'warn')}
function scanErr(msg){flash('err');showHit('err');beepErr();vib([60,40,60]);toast(msg,'err')}
function onScan(code,format){
  if(!code)return;
  const f=String(format||'').toUpperCase().replace('-','_');
  const g=parseGS1(code,f);
  const sscc=(g&&g.sscc)||(/^(CODE_128|DATA_MATRIX|KEYBOARD|ITF|CODE_39)$/.test(f)?findSSCC(code):null);
  const ck=sscc||code;
  if(cool.code===ck&&Date.now()<cool.until)return;
  if(awaitPallet){
    awaitPallet=false;$('#banner').classList.add('hidden');
    const pv=sscc||code.replace(/[\x00-\x1f]/g,'');
    scanOk();setPallet(pv);toast(t('palletToast',{p:pv}),'ok');
    cool={code:ck,until:Date.now()+2000};return;
  }
  if(['EAN_13','EAN_8','UPC_A'].includes(f)&&!gtinValid(code)){scanErr(t('badRead'));cool={code,until:Date.now()+800};return}
  // product from GS1 or plain code
  let p=null,pre=null;
  if(g&&g.gtin){const ean=gtinToEan13(g.gtin);p=lookup(ean)||lookup(g.gtin)||{barcode:ean,ref:'',name:'',vol:'',unknown:true};pre={lot:g.lot||'',exp:g.exp||'',count:g.count||0,isCase:g.isCase}}
  if(ctx==='invPallet'){
    if(sheetScan&&invSheetScan){cool={code:ck,until:Date.now()+(S.invPlusCase?(+S.cool||1200):4000)};if(!p&&!sscc)p=lookup(code.replace(/[\x00-\x1f]/g,''))||invCodeProduct(code)||null;invSheetScan({p,pre,sscc,code});return}
    cool={code:ck,until:Date.now()+2500};
    if(sscc){scanOk();invOpenPallet(sscc);return}
    if(!p&&!(f==='DATA_MATRIX'&&!g))p=lookup(code)||invCodeProduct(code);
    if(p){scanOk();invProductPick(p,code);return}
    scanOk();showRawCode(code,f);return;
  }
  if(sscc){scanOk();setPallet(sscc);toast(t('palletToast',{p:sscc}),'ok');cool={code:ck,until:Date.now()+2500};return}
  if(!p){
    if(f==='DATA_MATRIX'&&!g){scanOk();cool={code:ck,until:Date.now()+2500};showRawCode(code,f);return}
    p=lookup(code)||{barcode:code.replace(/[\x00-\x1f]/g,''),ref:'',name:'',vol:'',unknown:true};
  }
  scanOk();
  processProduct(p,{scanned:true,code:ck,pre});
}
function showRawCode(code,f){
  const vis=String(code).replace(/\x1d/g,'␝');
  const sh=openSheet(`<h3>${t('rawTitle')}</h3><div class="mut">${esc(f)}</div><div class="prev" style="white-space:pre-wrap;word-break:break-all;margin:8px 0">${esc(vis)}</div><div class="mut">${t('rawHint')}</div>
    <div class="acts"><button class="btn ghost" data-a="cancel">${t('close')}</button><button class="btn ghost" data-a="copy">${t('copy')}</button></div>`);
  sh.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.a==='cancel')closeSheet();
    if(b.dataset.a==='copy'){try{navigator.clipboard.writeText(vis).then(()=>toast(t('copied'),'ok'))}catch(e){}}};
}
function processProduct(p,{scanned=false,code=null,pre=null}={}){
  const ck=code||p.barcode||pid(p);
  if(!S.pallet){
    cool={code:ck,until:Infinity};
    openPalletSheet(()=>processProduct(p,{scanned,code,pre}),t('enterPalletFirst'));
    return;
  }
  if(scanned&&!p.unknown&&(S.mode==='plusc'||S.mode==='plusu')){
    const lot=(pre&&pre.lot)||(S.autoLot?lastLotFor(p,S.pallet):'');const exp=pre&&pre.exp||'';
    if(S.mode==='plusc'){
      const pc=perCaseOf(p)||(pre&&pre.isCase&&pre.count)||0;

}

function parseCsvLine(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out.map(s=>s.trim().replace(/^=/,'').replace(/^"(.*)"$/,'$1').trim());
}

function aiSpec(s){
  const two=s.slice(0,2),three=s.slice(0,3),d=+two;
  const fixed={'00':18,'01':14,'02':14,'03':14,'04':16,'11':6,'12':6,'13':6,'14':6,'15':6,'16':6,'17':6,'18':6,'19':6,'20':2};
  if(fixed[two])return {ai:two,len:fixed[two]};
  if(['10','21','22','30','37','90','91','92','93','94','95','96','97','98','99'].includes(two))return {ai:two,len:0,max:two==='90'?30:d>=91?90:(two==='30'||two==='37')?8:20};
  if(d>=31&&d<=36)return {ai:s.slice(0,4),len:6};
  if(/^41[0-7]$/.test(three))return {ai:three,len:13};
  if(['422','424','426'].includes(three))return {ai:three,len:3};
  if(['23','24','25','40','42'].includes(two))return {ai:three,len:0,max:30};
  if(['39','70','71','72','80','81','82'].includes(two))return {ai:s.slice(0,4),len:0,max:70};
  return null;
}
function parseGS1(raw,format){
  if(!raw)return null;let s=String(raw),flagged=false;
  if(/^\][A-Za-z]\d/.test(s)){flagged=/^\](C1|d2|Q3|e0|J1)/.test(s);s=s.slice(3)}
  if(s[0]===GS){flagged=true;s=s.slice(1)}
  if(/^\(\d{2,4}\)/.test(s)){s=s.replace(/\((\d{2,4})\)/g,(m,a,o)=>(o?GS:'')+a);flagged=true}
  if(s.includes(GS))flagged=true;
  const f=String(format||'').toUpperCase().replace('-','_');
  if(!flagged&&!/^(CODE_128|DATA_MATRIX|QR_CODE|KEYBOARD)$/.test(f))return null;
  const out={};let pos=0;
  while(pos<s.length){
    if(s[pos]===GS){pos++;continue}
    const sp=aiSpec(s.slice(pos));if(!sp)return null;
    pos+=sp.ai.length;let v;
    if(sp.len){v=s.substr(pos,sp.len);if(v.length<sp.len)return null;pos+=sp.len}
    else{let e=s.indexOf(GS,pos);if(e<0)e=s.length;if(e-pos>sp.max||e===pos)return null;v=s.slice(pos,e);pos=e}
    out[sp.ai]=v;
  }
  if(!Object.keys(out).length)return null;
  for(const k of ['00','01','02'])if(out[k]&&!/^\d+$/.test(out[k]))return null;
  if(!flagged){if(!(out['00']||out['01']||out['02']))return null;for(const k of ['00','01','02'])if(out[k]&&!validMod10(out[k]))return null}
  const r={raw:String(raw),ai:out};
  if(out['00'])r.sscc=out['00'];
  const g=out['01']||out['02'];if(g){r.gtin=g;r.isCase=!!out['02']||g[0]!=='0'}
  if(out['10'])r.lot=out['10'];
  if(out['17']||out['15']){const v=out['17']||out['15'];r.exp='20'+v.slice(0,2)+'-'+v.slice(2,4)+(v.slice(4,6)==='00'?'':'-'+v.slice(4,6))}
  if(out['37'])r.count=parseInt(out['37'],10);
  if(out['21'])r.serial=out['21'];
  return r;
}
function gtinToEan13(g){if(g.length!==14)return g;if(g[0]==='0')return g.slice(1);const b=g.slice(1,13);return b+mod10(b)}
function findSSCC(text){
  const m=String(text||'').match(/\d{18,20}/g)||[];
  for(const x of m){if(x.length===20&&x.startsWith('00')&&validMod10(x.slice(2)))return x.slice(2);if(x.length===18&&validMod10(x))return x}
  return null;
}

const XLSX_URL='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let xlsxP=null;
function ensureXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(xlsxP)return xlsxP;
  xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=XLSX_URL;s.crossOrigin='anonymous';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('xlsx'));s.onerror=()=>{xlsxP=null;rej(new Error('xlsx'))};document.head.appendChild(s)});
  return xlsxP;
}

function breakdown(q,pc){if(!pc)return '';const c=Math.floor(q/pc),u=q-c*pc;return t('nCases',{n:c})+(u?' + '+u:'')}
/* ---------- product identity & reconciliation ---------- */
function idsOf(p){const s=new Set();if(!p)return s;for(const v of [p.barcode,p.ref,p.code])if(v)s.add(String(v).trim().toUpperCase());return s}

    ${total>ids.length?`<button class="btn ghost wide" data-inv="more" style="margin-top:8px">${t('invMore',{n:total-ids.length})}</button>`:''}
    <div class="sect">${t('invTeamHdr')}</div>
    <div class="card"><p class="mut" style="margin-top:0">${t('invTeamHint')}</p>
      <div class="row2"><button class="btn ghost wide" data-inv="share">${t('invShareRes')}</button>
      <label class="btn ghost wide" style="cursor:pointer">${t('invMergeRes')}<input type="file" accept=".json,application/json" class="hidden" data-inv="merge"></label></div></div>
    <div class="sect">${t('invExportHdr')}</div>
    <button class="btn primary wide" data-inv="export">${t('invExportBtn')}</button>
    <p class="mut">${t('invExportHint')}</p>
    <div class="row2"><label class="btn ghost wide" style="cursor:pointer">${t('invNewReport')}<input type="file" accept=".xlsx,.xls" class="hidden" data-inv="file"></label><button class="btn danger" data-inv="del">${t('invDelete')}</button></div>`;
  if(hasQ){const i=$('#invQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
function invStartScan(){ctx='invPallet';showView('scan');renderBanner();unlockAudio();if(!scanning)startCamera()}
function renderBanner(){
  const bn=$('#banner');if(!bn)return;
  document.body.classList.toggle('invctx',ctx==='invPallet');
  $('#manualBtn').textContent=t(ctx==='invPallet'?'invFindPallet':'manualBtn');
  if(ctx==='invPallet'){const c=invCounts();bn.innerHTML=`<span>${t('invScanBanner')} · ${c.all-c.pending}/${c.all}</span><button data-a="endinv">✕</button>`;bn.classList.remove('hidden');bn.classList.add('inv')}
  else if(!awaitPallet){bn.classList.add('hidden');bn.classList.remove('inv')}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-inv],[data-flt],[data-pal],#banner [data-a="endinv"]');if(!b)return;
  if(b.matches('#banner [data-a="endinv"]')){ctx='free';renderAll();return}
  if(b.dataset.flt){S.invFilter=b.dataset.flt;invShow=60;save();renderInv();return}
  if(b.dataset.pal&&b.closest('#invBody')){invOpenPallet(b.dataset.pal);return}
  const a=b.dataset.inv;
  if(a==='blind'){S.invBlind=!S.invBlind;save();renderInv()}
  if(a==='quick'){S.invQuick=!S.invQuick;save();renderInv()}
  if(a==='scan')invStartScan();
  if(a==='find')invManualPallet();
  if(a==='more'){invShow+=100;renderInv()}
  if(a==='export')invExport();
  if(a==='share')invShareResults();
  if(a==='del'){const sh=openSheet(`<h3>${t('invDeleteQ')}</h3><div class="note w">${t('invDeleteWarn')}</div><div class="acts"><button class="btn ghost" data-a="cancel">${t('back')}</button><button class="btn dangerfill" data-a="ok">${t('invDelete')}</button></div>`);
    sh.onclick=ev2=>{const x=ev2.target.closest('button');if(!x)return;if(x.dataset.a==='cancel')closeSheet();if(x.dataset.a==='ok'){S.inv=null;ctx='free';save();buildIndex();closeSheet();renderAll()}}}
});
document.addEventListener('change',ev=>{
  const i=ev.target.closest('input[data-inv="file"]');if(i){const f=i.files[0];i.value='';if(f)invImport(f);return}
  const m=ev.target.closest('input[data-inv="merge"]');if(m){const f=m.files[0];m.value='';if(f)invMergeResults(f);return}
  const s=ev.target.closest('select[data-inv-set]');if(s){S[s.dataset.invSet]=s.value;save();return}
  const d=ev.target.closest('input[data-inv-dev]');if(d){S.device=d.value.trim();save();return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='invQ'){invShow=60;renderInv()}});

/* ---------- team: share & merge results ---------- */
async function invShareResults(){
  if(!S.device)toast(t('invNeedDevice'),'warn');
  const pal=Object.fromEntries(Object.entries(S.inv.pal).filter(([k,v])=>v.checkedAt||v.link));
  const data=JSON.stringify({app:'palet-sayim-inv',fp:S.inv.fp,fileName:S.inv.fileName,device:S.device||'',ts:Date.now(),pal});
  const d=new Date();const name='envanter_'+(S.device||'cihaz').replace(/[^\w\-]+/g,'_')+'_'+fDate(d)+'_'+pad2(d.getHours())+pad2(d.getMinutes())+'.json';
  if(await shareFile(new Blob([data],{type:'application/json'}),name))toast(t('invShared',{n:Object.keys(pal).length}),'ok');
}
async function invMergeResults(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){return toast(t('restoreBad'),'err')}
  if(!o||o.app!=='palet-sayim-inv'||!o.pal)return toast(t('restoreBad'),'err');
  if(o.fp&&S.inv.fp&&o.fp!==S.inv.fp)return toast(t('invMergeOther'),'err');
  let add=0,upd=0,keep=0;
  for(const [k,r] of Object.entries(o.pal)){
    if(!r.device)r.device=o.device||'';
    const l=S.inv.pal[k];
    if(!l||!l.checkedAt){S.inv.pal[k]={...(l||{}),...r};add++}
    else if((r.checkedAt||0)>(l.checkedAt||0)){S.inv.pal[k]={...r,note:[r.note,t('invMergedOver',{d:l.device||'?'})].filter(Boolean).join(' · ')};upd++}
    else keep++;
  }
  save();renderAll();toast(t('invMerged',{a:add,u:upd,k:keep,d:o.device||'?'}),'ok');
}

/* ---------- export: same format + differences sheet ---------- */
async function invExport(){
  let XL;try{XL=await ensureXLSX()}catch(e){return toast(t('xlsxFail'),'err')}
  const inv=S.inv,C=inv.col,n=inv.ncol;
  for(const id of Object.keys(inv.pal)){const r=inv.pal[id];if(r.lines&&!r.res&&r.checkedAt){legacyFound(r,invRows(id));r.res=reconcile(invRows(id),r.found||[])}}
  const aoa=inv.head.map(r=>{const a=r.slice();while(a.length<n)a.push('');return a});
  const h=inv.hdr.map(cellStr);while(h.length<n)h.push('');aoa.push(h);
  let total=0;
  const put=o=>{const a=new Array(n).fill('');const set=(k,v)=>{if(C[k]>=0)a[C[k]]=v};
    set('bancale',o.bancale);set('codPrec',o.codPrec||'');set('mag',o.mag||'');set('pos',o.pos||'');set('code',o.code||'');set('desc',o.desc||'');set('lot',o.lot||'');set('exp',o.exp||'');set('um',o.um||'');set('qty',+o.qty||0);
    total+=+o.qty||0;aoa.push(a)};
  const D=[[t('xBancale'),t('xLabel'),t('xCode'),t('xDesc'),t('xLotRep'),t('xLotCnt'),t('xQtyRep'),t('xQtyCnt'),t('xDiff'),t('xCases'),t('xPc'),t('xUnits'),t('xCount1'),t('xCount2'),t('xType'),t('xRc'),t('xStatus'),t('xLevel'),t('xOpen'),t('xReasons'),t('xNote'),t('xTime'),t('xDevice')]];
  const mag0=inv.rows[0]?inv.rows[0].mag:'';
  const meta=(rec,st)=>[t('st_'+st)+(rec.noLabel?' / '+t('invNoLabel'):''),rec.level||'',rec.flagOpen?t('yes'):'',(rec.reasons||[]).map(x=>t(x)).join(', '),rec.note||'',rec.checkedAt?fDate(rec.checkedAt)+' '+fTime(rec.checkedAt):'',rec.device||''];
  const emit=(id,rows,rec,st)=>{
    const res=rec.res||[];const byRow={};
    if(st!=='pending'&&!rec.quick)for(const p of res)if(p.type!=='extra'){
      let left=p.cnt;p.rowIdx.forEach((ri,j)=>{const r=rows.find(x=>x.i===ri);if(!r)return;const last=j===p.rowIdx.length-1;const v=last?left:Math.min(left,r.qty);left-=v;byRow[ri]={qty:v,lot:p.type==='lot'?(p.lotCnt.split(' / ')[0]||r.lot):r.lot}})}
    for(const r of rows){const o={...r};if(st==='missing')o.qty=0;else if(byRow[r.i]){o.qty=byRow[r.i].qty;o.lot=byRow[r.i].lot}put(o)}
    for(const p of res.filter(p=>p.type==='extra'))put({bancale:id,mag:rows[0]?rows[0].mag:mag0,code:p.code,desc:p.name,lot:p.lotCnt,um:'PEZZI',qty:p.cnt});
    if(st==='pending'){for(const r of rows)D.push([id,rec.link||'',r.code,r.desc,r.lot,'',r.qty,'','','','','','','',t('st_pending')+(lotTypo(r.lot)?' / '+t('xLotTypo'):''),'','','','','','','',''].slice(0,23));return}
    const list=res.length?res:groupsOf(rows).map(g=>({key:g.key,type:'quick',code:g.code,name:g.desc,exp:g.exp,cnt:null,diff:null,lotExp:g.lot,lotCnt:g.lot}));
    for(const p of list){
      const rc=rec.rcodes&&rec.rcodes[p.key]?t(rec.rcodes[p.key]):'';
      D.push([id,rec.link||'',p.code,p.name,p.lotExp||'',p.lotCnt||'',p.exp,p.cnt==null?'':p.cnt,p.diff==null?'':p.diff,p.c===''?'':p.c,p.c?p.pc:'',p.u===''?'':p.u,p.r1!=null?p.r1:'',p.r2!=null?p.r2:'',
        p.type==='quick'?t('st_quick'):TYPE_TXT(p)+(p.lotExp&&lotTypo(p.lotExp)?' / '+t('xLotTypo'):''),rc,...meta(rec,st)]);
    }
  };
  for(const id of inv.order){const rec=inv.pal[id]||{};emit(id,invRows(id),rec,invStatus(id))}
  for(const id of invIds().filter(i=>!inv.order.includes(i))){const rec=inv.pal[id];if(rec&&rec.checkedAt)emit(id,[],rec,invStatus(id))}
  const tot=new Array(n).fill('');if(C.um>=0)tot[C.um]='Totale generale:';else tot[Math.max(0,C.qty-1)]='Totale generale:';tot[C.qty]=total;aoa.push(tot);
  const ws=XL.utils.aoa_to_sheet(aoa);ws['!merges']=inv.merges;ws['!cols']=inv.cols||[{wch:20},{wch:20},{wch:12},{wch:9},{wch:16},{wch:40},{wch:12},{wch:10},{wch:7},{wch:9}];
  const ws2=XL.utils.aoa_to_sheet(D);ws2['!cols']=[{wch:20},{wch:20},{wch:16},{wch:36},{wch:12},{wch:12},{wch:9},{wch:9},{wch:8},{wch:6},{wch:7},{wch:6},{wch:8},{wch:8},{wch:18},{wch:20},{wch:16},{wch:6},{wch:8},{wch:30},{wch:24},{wch:18},{wch:14}];
  const wb=XL.utils.book_new();XL.utils.book_append_sheet(wb,ws,inv.sheetName||'Situazione');XL.utils.book_append_sheet(wb,ws2,t('xSheetDiff').slice(0,31));
  const base=String(inv.fileName||'giacenza').replace(/\.[^.]+$/,'');const d=new Date();
  const name=base+'_kontrol_'+fDate(d)+'_'+pad2(d.getHours())+pad2(d.getMinutes())+'.xlsx';
  if(await shareFile(new Blob([XL.write(wb,{bookType:'xlsx',type:'array'})],{type:XLSX_MIME}),name)){inv.lastExport=Date.now();save();toast(t('xlsxReady'),'ok')}
}


try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
buildIndex();
initDecoder();
applyLang();
renderAll();
if(!S.pallet)setTimeout(()=>{if(!sheetOpen())openPalletSheet()},300);

</script>
